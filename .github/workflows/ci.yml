name: CI - projet Cypress
on:
    push:
      branches: [Tavernier]
jobs:
    linter:
        name: Verification EsLint
        runs-on: ubuntu-latest
        continue-on-error: true

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20
                cache: 'npm'
            # - name: Install yarn
            #   run: npm install yarn@latest -g
            
            - name: install Eslint
            #   run: npm install eslint eslint-plugin-cypress --save-dev --legacy-peer-deps
              run: npx eslint

