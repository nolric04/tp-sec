name: CI - projet Cypress
on:
    push:
      branches: [Tavernier]
jobs:
    linter:
        name: Verification EsLint
        runs-on: ubuntu-latest
        continue-on-error: true

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20
                cache: 'npm'
            
            - name: Install ESLint, Cypress plugin and globals
              run: |
                npm install eslint eslint-plugin-cypress globals --save-dev --legacy-peer-deps

            - name: Run ESLint on project
              run: npx eslint "cypress/**/*.{ts,tsx}" "src/**/*.{ts,tsx}"


